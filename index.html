<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="睡眠ASMR">
<title>睡眠ASMR</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2313141c'/><circle cx='41' cy='32' r='20' fill='%23c084fc'/><circle cx='51' cy='32' r='20' fill='%2313141c'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2313141c'/><circle cx='41' cy='32' r='20' fill='%23c084fc'/><circle cx='51' cy='32' r='20' fill='%2313141c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e14;
    --surface: #13141c;
    --surface2: #1a1b26;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6aff;
    --accent2: #c084fc;
    --text: #e8e6f0;
    --muted: #6b6880;
    --star: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* 背景の星くず */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 70%, rgba(255,255,255,0.25) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 85%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(600px 400px at 30% 20%, rgba(124,106,255,0.06) 0%, transparent 70%),
      radial-gradient(400px 600px at 80% 80%, rgba(192,132,252,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ヘッダー */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,14,20,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, #c084fc, #7c6aff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo span {
    font-style: italic;
    font-size: 13px;
    -webkit-text-fill-color: var(--muted);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    margin-left: 6px;
  }

  .add-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(124,106,255,0.4);
    background: rgba(124,106,255,0.12);
    color: var(--accent);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .add-btn:active { transform: scale(0.92); background: rgba(124,106,255,0.25); }

  /* カテゴリタブ */
  .category-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .category-scroll::-webkit-scrollbar { display: none; }

  .cat-chip {
    flex-shrink: 0;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .cat-chip.active {
    border-color: rgba(124,106,255,0.6);
    background: rgba(124,106,255,0.15);
    color: var(--accent2);
  }

  /* メイン */
  main {
    position: relative;
    z-index: 1;
    padding: 16px 16px 170px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty-state .moon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; line-height: 1.8; }

  /* 動画カード */
  .video-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .video-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    align-items: stretch;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .video-card:active { transform: scale(0.98); border-color: rgba(124,106,255,0.3); }

  .thumb-wrap {
    position: relative;
    width: 120px;
    flex-shrink: 0;
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .skip-badge {
    position: absolute;
    bottom: 6px;
    left: 6px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }

  .card-info {
    flex: 1;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--text);
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .cat-tag {
    font-size: 10px;
    color: var(--accent2);
    background: rgba(192,132,252,0.1);
    border: 1px solid rgba(192,132,252,0.2);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .card-actions {
    display: flex;
    gap: 4px;
  }

  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .icon-btn:active { background: rgba(255,255,255,0.08); color: var(--text); }

  /* モーダル */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    width: 100%;
    background: var(--surface2);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    border-top: 1px solid var(--border);
    padding: 20px 20px 40px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    max-height: 90dvh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--text);
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, select:focus {
    border-color: rgba(124,106,255,0.5);
  }
  input::placeholder { color: var(--muted); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #7c6aff, #c084fc);
    color: #fff;
    font-size: 15px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
  }
  .submit-btn:active { opacity: 0.85; }

  .cancel-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    cursor: pointer;
    margin-top: 8px;
  }

  /* 削除確認 */
  .del-modal .modal-title { color: #f87171; }
  .del-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    background: rgba(248,113,113,0.15);
    border: 1px solid rgba(248,113,113,0.3);
    color: #f87171;
    font-size: 15px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    cursor: pointer;
    margin-top: 8px;
  }

  /* カテゴリ管理 */
  .cat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .cat-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
  }
  .cat-item button {
    background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer;
  }

  /* 再生トースト */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30,30,45,0.95);
    border: 1px solid rgba(124,106,255,0.3);
    color: var(--text);
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 30px;
    z-index: 300;
    opacity: 0;
    transition: all 0.3s;
    white-space: nowrap;
    backdrop-filter: blur(10px);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .count-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 12px;
    padding-left: 2px;
  }

  /* 同期 / バックアップモーダル */
  .sync-status {
    display: inline-block;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 12px;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .sync-status.syncing { color: var(--accent2); border-color: rgba(192,132,252,0.35); }
  .sync-status.ok      { color: #6ee7b7; border-color: rgba(110,231,183,0.35); background: rgba(110,231,183,0.06); }
  .sync-status.err     { color: #f87171; border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.06); }

  .sync-divider {
    height: 1px;
    background: var(--border);
    margin: 22px 0 18px;
  }

  .section-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0 14px;
    font-size: 13px;
    color: var(--text);
  }
  .toggle-row > label { margin: 0; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text); }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 6px 0 4px;
  }

  .mini-btn {
    flex: 1;
    min-width: 0;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .mini-btn:active { background: var(--surface); }
  .mini-btn.primary {
    background: rgba(124,106,255,0.15);
    border-color: rgba(124,106,255,0.4);
    color: var(--accent2);
  }

  .json-area {
    width: 100%;
    min-height: 80px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 11px;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    padding: 10px 12px;
    resize: vertical;
    margin-top: 8px;
    outline: none;
    -webkit-appearance: none;
  }
  .json-area:focus { border-color: rgba(124,106,255,0.5); }

  .inline-select {
    width: auto;
    padding: 6px 10px;
    font-size: 12px;
  }

  .warning {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
    margin-top: 18px;
    padding: 10px 12px;
    background: rgba(251,191,36,0.05);
    border: 1px solid rgba(251,191,36,0.15);
    border-radius: 8px;
  }

  /* 下部固定フィルタバー */
  .filter-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 100;
    background: rgba(13, 14, 20, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 8px 12px calc(4px + env(safe-area-inset-bottom));
  }

  /* タグ chip 行 (フィルタバー内) */
  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-label {
    flex-shrink: 0;
    font-size: 13px;
    color: var(--muted);
    width: 18px;
    text-align: center;
  }

  /* チャンネルタブ (アンダーラインスタイル) */
  .channel-tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 4px;
    padding-left: 26px;
  }
  .channel-tabs::-webkit-scrollbar { display: none; }
  .channel-tab {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 14px 10px;
    min-width: 64px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.18s, border-color 0.18s;
  }
  .channel-tab.active {
    color: var(--accent2);
    border-bottom-color: var(--accent2);
  }
  .channel-tab-icon {
    font-size: 18px;
    line-height: 1;
    min-height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .channel-tab-text {
    font-size: 12px;
    line-height: 1.2;
  }

  /* チャンネル管理行の絵文字入力 */
  .ch-icon {
    width: 38px;
    text-align: center;
    font-size: 18px;
    padding: 4px;
    margin-right: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
  }
  .cat-item.with-icon { gap: 0; }
  .cat-item .name-text { flex: 1; }

  /* 軸切替セグメント (管理モーダル用) */
  .axis-segment {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin: 0 0 10px;
  }
  .axis-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .axis-btn.active {
    background: rgba(124,106,255,0.18);
    color: var(--accent2);
  }
  .axis-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* チャンネル行 (select + ＋) */
  .channel-row { display: flex; gap: 6px; align-items: stretch; }
  .channel-row select { flex: 1; }
  .channel-row .mini-btn { flex-shrink: 0; padding: 0 14px; }
  .hint-muted { color: var(--muted); font-size: 11px; font-weight: 400; }
  .fetch-hint { color: var(--accent2); font-size: 11px; font-weight: 400; margin-left: 6px; }

  /* タグ複数選択 */
  .tag-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 140px;
    overflow-y: auto;
    padding: 4px 2px;
  }
  .tag-chip {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tag-chip.on {
    border-color: rgba(192,132,252,0.5);
    background: rgba(192,132,252,0.18);
    color: var(--accent2);
  }

  /* カードのチャンネル + タグバッジ行 */
  .badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  .channel-tag {
    font-size: 10px;
    color: var(--accent);
    background: rgba(124,106,255,0.12);
    border: 1px solid rgba(124,106,255,0.25);
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* 並び替えボタン (管理モーダル) */
  .reorder-btns { display: flex; gap: 2px; }
  .reorder-btns button {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .reorder-btns button:disabled { opacity: 0.3; cursor: not-allowed; }
  .reorder-btns button:not(:disabled):active { background: rgba(124,106,255,0.18); color: var(--accent2); }

  /* スキップ秒プレビュー */
  .skip-preview {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    min-height: 16px;
    letter-spacing: 0.02em;
  }
  .skip-preview.invalid { color: #f87171; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">睡眠 ASMR <span>おやすみリスト</span></div>
    <div style="display:flex;gap:8px">
      <button class="add-btn" onclick="openSyncModal()" title="同期 / バックアップ" style="font-size:16px">⚙</button>
      <button class="add-btn" onclick="openManageModal()" title="タグ／チャンネル管理" style="font-size:16px">🏷</button>
      <button class="add-btn" onclick="openAddModal()" title="動画追加">＋</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="empty-state" id="emptyState">
    <div class="moon">🌙</div>
    <p>まだ動画が登録されていません<br>＋ボタンから追加してみましょう</p>
  </div>
  <div class="video-grid" id="videoGrid"></div>
</main>

<!-- 追加/編集モーダル -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">動画を追加</div>
    <div class="form-group">
      <label>YouTube URL <span id="urlFetchHint" class="fetch-hint"></span></label>
      <input type="url" id="inputUrl" placeholder="https://www.youtube.com/watch?v=..." inputmode="url" onchange="handleUrlChange()" onblur="handleUrlChange()">
    </div>
    <div class="form-group">
      <label>動画タイトル</label>

<!-- Firebase SDK (compat build) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const STORAGE_KEY = 'asmr_videos_v3';
const TAGS_KEY = 'asmr_tags_v3';
const CHANNELS_KEY = 'asmr_channels_v3';
const STORAGE_KEY_V2 = 'asmr_videos_v2';
const CAT_KEY_V2 = 'asmr_cats_v2';
const META_KEY = 'asmr_meta_v1';
const LEGACY_SYNC_KEY = 'asmr_sync_v1';
const PUSH_DEBOUNCE_MS = 1500;

// Firebase の Web 設定は公開前提の値 (書き込み制御は Firestore ルール側で行う)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDl6tizWK1KkfqIR2rgdK1Ga3IP_DbBYZk",
  authDomain: "asmr-list-b8bac.firebaseapp.com",
  projectId: "asmr-list-b8bac",
  storageBucket: "asmr-list-b8bac.firebasestorage.app",
  messagingSenderId: "593232059373",
  appId: "1:593232059373:web:5b3dd18bf03dba94b425e4"
};
const CLOUD_COLLECTION = 'asmr_list';
const CLOUD_DOC = 'main';
const FIREBASE_SDK_FALLBACK = '9.23.0';
const DEFAULT_TAGS = ["癒し系","囁き系","環境音","バイノーラル","その他"];

function migrateV2ToV3() {
  if (localStorage.getItem(STORAGE_KEY) !== null) return;
  const v2v = JSON.parse(localStorage.getItem(STORAGE_KEY_V2) || 'null');
  const v2c = JSON.parse(localStorage.getItem(CAT_KEY_V2) || 'null');
  if (Array.isArray(v2v)) {
    const migrated = v2v.map(v => ({
      id: v.id,
      url: v.url,
      title: v.title,
      skip: v.skip,
      channel: v.channel || '',
      tags: Array.isArray(v.tags) ? v.tags : (v.cat ? [v.cat] : [])
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
  } else {
    localStorage.setItem(STORAGE_KEY, '[]');
  }
  if (Array.isArray(v2c) && v2c.length) {
    localStorage.setItem(TAGS_KEY, JSON.stringify(v2c));
  }
  if (localStorage.getItem(CHANNELS_KEY) === null) {
    localStorage.setItem(CHANNELS_KEY, '[]');
  }
}
migrateV2ToV3();

function setupAppleTouchIcon() {
  try {
    const size = 180, s = size / 64;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#13141c';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#c084fc';
    ctx.beginPath();
    ctx.arc(41 * s, 32 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#13141c';
    ctx.beginPath();
    ctx.arc(51 * s, 32 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
    const dataUrl = canvas.toDataURL('image/png');
    let link = document.querySelector('link[rel="apple-touch-icon"]');
    if (!link) {
      link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      document.head.appendChild(link);
    }
    link.href = dataUrl;
  } catch {}
}
setupAppleTouchIcon();

let videos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let tags = JSON.parse(localStorage.getItem(TAGS_KEY) || JSON.stringify(DEFAULT_TAGS));
let channels = JSON.parse(localStorage.getItem(CHANNELS_KEY) || '[]');
function normalizeChannels() {
  channels = channels.map(c => typeof c === 'string'
    ? { name: c, icon: '' }
    : { name: (c && c.name) || '', icon: (c && c.icon) || '' }
  );
}
normalizeChannels();
let meta = JSON.parse(localStorage.getItem(META_KEY) || '{}');
// 旧 GitHub Gist 同期で端末に残っている PAT を破棄する
localStorage.removeItem(LEGACY_SYNC_KEY);
let tagFilter = '';
let channelFilter = '';
let editingId = null;
let deletingId = null;
let pushTimer = null;
let manageKind = 'tag';
let selectedTags = [];
let selectedChannel = '';

function persistLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
  localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
  localStorage.setItem(CHANNELS_KEY, JSON.stringify(channels));
  localStorage.setItem(META_KEY, JSON.stringify(meta));
}

function save() {
  meta.updatedAt = new Date().toISOString();
  persistLocal();
  schedulePush();
}

function migrateRemoteToV2(remote) {
  if (remote && remote.version === 2) return remote;
  const r = remote || {};
  const vids = Array.isArray(r.videos) ? r.videos.map(v => ({
    id: v.id,
    url: v.url,
    title: v.title,
    skip: v.skip,
    channel: v.channel || '',
    tags: Array.isArray(v.tags) ? v.tags : (v.cat ? [v.cat] : [])
  })) : [];
  return {
    version: 2,
    videos: vids,
    tags: Array.isArray(r.categories) ? r.categories : (Array.isArray(r.tags) ? r.tags : []),
    channels: Array.isArray(r.channels) ? r.channels : [],
    updatedAt: r.updatedAt || ''
  };
}

/* ---------- クラウド同期 (Firebase Firestore) ---------- */
let cloudDoc = null;        // Firestore の DocumentReference
let cloudReady = false;     // 認証と購読が完了したか
let applyingRemote = false; // リモート適用中の push 抑止フラグ
let lastSyncedAt = null;

function buildPayload() {
  return {
    version: 2,
    videos,
    tags,
    channels,
    updatedAt: meta.updatedAt || new Date().toISOString()
  };
}

function isEmptyData(vs, chs) {
  return !vs.length && !chs.length;
}

function schedulePush() {
  if (!cloudDoc || applyingRemote) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    pushToCloud().catch(e => setStatus('err', e.message));
  }, PUSH_DEBOUNCE_MS);
}

function applyRemote(remote) {
  const r = migrateRemoteToV2(remote);
  applyingRemote = true;
  videos = r.videos;
  if (r.tags.length) tags = r.tags;
  channels = r.channels;
  normalizeChannels();
  meta.updatedAt = r.updatedAt || new Date().toISOString();
  persistLocal();
  applyingRemote = false;
  renderFilterTabs();
  renderVideos();
}

async function pushToCloud() {
  if (!cloudDoc) return;
  setStatus('syncing');
  if (!meta.updatedAt) {
    meta.updatedAt = new Date().toISOString();
    persistLocal();
  }
  await cloudDoc.set(buildPayload());
  setStatus('ok');
}

// クラウドの内容を受け取ったときの反映判断 (updatedAt の新しい方を採用)
function onCloudSnapshot(snap) {
  if (snap.metadata.hasPendingWrites) return; // 自分の書き込みの反射は無視
  cloudReady = true;

  if (!snap.exists) { // 初回: この端末の内容でクラウドを初期化
    pushToCloud().catch(e => setStatus('err', e.message));
    return;
  }

  const r = migrateRemoteToV2(snap.data() || {});
  const remoteTs = r.updatedAt || '';
  const localTs = meta.updatedAt || '';
  const remoteEmpty = isEmptyData(r.videos, r.channels);
  const localEmpty = isEmptyData(videos, channels);

  // 空のクラウドデータで手元のリストを消さない
  if (remoteEmpty && !localEmpty) {
    pushToCloud().catch(e => setStatus('err', e.message));
  } else if (remoteTs > localTs) {
    applyRemote(r);
    setStatus('ok');
    showToast('クラウドから同期しました 🌙');
  } else if (localTs > remoteTs) {
    pushToCloud().catch(e => setStatus('err', e.message));
  } else {
    setStatus('ok');
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(src));
    document.head.appendChild(s);
  });
}

// <script> タグでの読み込みに失敗した場合の予備 (CDN 一時障害・別バージョン)
async function ensureFirebaseSdk() {
  const loaded = () => typeof firebase !== 'undefined' && !!firebase.initializeApp;
  if (loaded()) return true;
  try {
    for (const m of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) {
      await loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_FALLBACK}/${m}`);
    }
  } catch {
    return false;
  }
  return loaded();
}

async function initCloud() {
  if (!(await ensureFirebaseSdk())) {
    setStatus('err', 'SDK を読み込めません (オフライン?)');
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    setStatus('syncing', '接続中…');
    firebase.auth().signInAnonymously()
      .then(() => {
        cloudDoc = firebase.firestore().collection(CLOUD_COLLECTION).doc(CLOUD_DOC);
        cloudDoc.onSnapshot(onCloudSnapshot, err => setStatus('err', err.message));
      })
      .catch(e => setStatus('err', e.message));
  } catch (e) {
    setStatus('err', e.message);
  }
}

function setStatus(kind, msg) {
  if (kind === 'ok') lastSyncedAt = new Date();
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.classList.remove('ok', 'err', 'syncing');
  if (kind === 'syncing') {
    el.classList.add('syncing');
    el.textContent = msg || '同期中…';
  } else if (kind === 'ok') {
    el.classList.add('ok');
    const t = lastSyncedAt || new Date();
    const hh = String(t.getHours()).padStart(2, '0');
    const mm = String(t.getMinutes()).padStart(2, '0');
    el.textContent = `同期済み ${hh}:${mm}`;
  } else if (kind === 'err') {
    el.classList.add('err');
    el.textContent = `エラー: ${msg || ''}`.slice(0, 80);
  } else {
    el.textContent = cloudReady ? '待機中' : '接続中…';
  }
}

function openSyncModal() {
  document.getElementById('exportPreview').value = '';
  document.getElementById('importText').value = '';
  openModal('syncModal');
}

async function handleCloudPull() {
  if (!cloudDoc) { showToast('クラウドに接続できていません'); return; }
  try {
    setStatus('syncing');
    const snap = await cloudDoc.get();
    if (!snap.exists) { showToast('クラウドにまだデータがありません'); setStatus(null); return; }
    applyRemote(snap.data());
    setStatus('ok');
    showToast('クラウドから取得しました 🌙');
  } catch (e) {
    setStatus('err', e.message);
    showToast('取得失敗: ' + e.message);
  }
}

async function handleCloudPush() {
  if (!cloudDoc) { showToast('クラウドに接続できていません'); return; }
  try {
    meta.updatedAt = new Date().toISOString();
    persistLocal();
    await pushToCloud();
    showToast('クラウドに送信しました');
  } catch (e) {
    setStatus('err', e.message);
    showToast('送信失敗: ' + e.message);
  }
}

function exportJson() {
  const payload = { version: 2, videos, tags, channels, exportedAt: new Date().toISOString() };
  const text = JSON.stringify(payload, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  a.href = url;
  a.download = `asmr-list-${date}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
  document.getElementById('exportPreview').value = text;
  showToast('エクスポートしました');
}

function importJsonFromText() {
  const text = document.getElementById('importText').value.trim();
  if (!text) { showToast('JSON を貼り付けてください'); return; }
  applyImport(text, document.getElementById('importMode').value);
}

function applyImport(text, mode) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch { showToast('JSON の形式が不正です'); return; }
  if (!parsed || !Array.isArray(parsed.videos)) {
    showToast('videos が配列ではありません'); return;
  }
  const r = migrateRemoteToV2(parsed);
  if (mode === 'replace') {
    videos = r.videos;
    if (r.tags.length) tags = r.tags;
    channels = r.channels;
  } else {
    const map = new Map(videos.map(v => [v.id, v]));
    r.videos.forEach(v => { if (v && v.id) map.set(v.id, v); });
    videos = Array.from(map.values());
    tags = Array.from(new Set([...tags, ...r.tags]));
    const seen = new Set(channels.map(c => (typeof c === 'string' ? c : c.name)));
    r.channels.forEach(c => {
      const name = typeof c === 'string' ? c : c.name;
      if (name && !seen.has(name)) { channels.push(c); seen.add(name); }
    });
  }
  normalizeChannels();
  save();
  renderFilterTabs();
  renderVideos();
  closeModal('syncModal');
  showToast(mode === 'replace' ? '上書きインポートしました' : 'マージインポートしました');
}

function extractVideoId(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtu.be')) {
      return u.pathname.slice(1).split(/[/?#]/)[0];
    }
    const m = u.pathname.match(/^\/(?:live|shorts|embed|v)\/([\w-]+)/);
    if (m) return m[1];
    return u.searchParams.get('v') || '';
  } catch { return ''; }
}

function thumbUrl(videoId) {
  return `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
}

function formatSkip(sec) {
  if (!sec || sec <= 0) return null;
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `0:${String(s).padStart(2,'0')}`;
}

function parseSkipInput(s) {
  s = (s || '').trim();
  if (s === '') return 0;
  if (!/^\d+$/.test(s)) return null;
  const n = parseInt(s, 10);
  if (s.length <= 2) return n;
  const ss = n % 100, mm = Math.floor(n / 100);
  if (ss < 60) return mm * 60 + ss;
  return n;
}

function formatSkipReadable(sec) {
  if (!sec || sec <= 0) return '指定なし';
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m === 0) return `${s}秒`;
  if (s === 0) return `${m}分`;
  return `${m}分${s}秒`;
}

function secondsToCompactInput(sec) {
  if (!sec || sec <= 0) return '';
  if (sec < 60) return String(sec);
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}${String(s).padStart(2, '0')}`;
}

function updateSkipPreview() {
  const inp = document.getElementById('inputSkip');
  const out = document.getElementById('skipPreview');
  if (!inp || !out) return;
  const parsed = parseSkipInput(inp.value);
  if (parsed === null) {
    out.textContent = '形式が不正です';
    out.classList.add('invalid');
  } else {
    out.textContent = parsed === 0 ? '指定なし' : `= ${formatSkipReadable(parsed)}`;
    out.classList.remove('invalid');
  }
}

function playVideo(v) {
  const id = extractVideoId(v.url);
  if (!id) { showToast('URLが無効です'); return; }
  const skip = parseInt(v.skip) || 0;
  const ytUrl = `https://www.youtube.com/watch?v=${id}${skip > 0 ? `&t=${skip}` : ''}`;
  showToast(`${skip > 0 ? formatSkip(skip)+'から' : ''}再生します 🎧`);
  setTimeout(() => { window.location.href = ytUrl; }, 500);
}

function videoMatchesFilter(v) {
  if (tagFilter && !(Array.isArray(v.tags) && v.tags.includes(tagFilter))) return false;
  if (channelFilter && v.channel !== channelFilter) return false;
  return true;
}

function renderFilterTabs() {
  renderTagFilterRow();
  renderChannelFilterRow();
}

function renderTagFilterRow() {
  const row = document.getElementById('tagFilterRow');
  if (!tags.length) { row.style.display = 'none'; return; }
  row.style.display = 'flex';
  const tabs = document.getElementById('tagFilterTabs');
  const baseFilter = v => !channelFilter || v.channel === channelFilter;
  const allCount = videos.filter(baseFilter).length;
  const entries = [['', `すべて (${allCount})`], ...tags.map(name => {
    const n = videos.filter(v => baseFilter(v) && Array.isArray(v.tags) && v.tags.includes(name)).length;
    return [name, `${name} (${n})`];
  })];
  tabs.innerHTML = entries.map(([val, label], idx) =>
    `<button class="cat-chip ${tagFilter === val ? 'active' : ''}" onclick="setTagFilterByIndex(${idx})">${escHtml(label)}</button>`
  ).join('');
}

function renderChannelFilterRow() {
  const tabs = document.getElementById('channelFilterTabs');
  if (!channels.length) { tabs.style.display = 'none'; return; }
  tabs.style.display = 'flex';
  const baseFilter = v => !tagFilter || (Array.isArray(v.tags) && v.tags.includes(tagFilter));
  const allCount = videos.filter(baseFilter).length;
  const entries = [{ name: '', icon: '', label: `すべて (${allCount})` }, ...channels.map(c => {
    const n = videos.filter(v => baseFilter(v) && v.channel === c.name).length;
    return { name: c.name, icon: c.icon || '', label: `${c.name} (${n})` };
  })];
  tabs.innerHTML = entries.map((e, idx) =>
    `<button class="channel-tab ${channelFilter === e.name ? 'active' : ''}" onclick="setChannelFilterByIndex(${idx})">` +
      `<span class="channel-tab-icon">${escHtml(e.icon)}</span>` +
      `<span class="channel-tab-text">${escHtml(e.label)}</span>` +
    `</button>`
  ).join('');
}

function setTagFilterByIndex(idx) {
  tagFilter = idx === 0 ? '' : (tags[idx - 1] || '');
  renderFilterTabs();
  renderVideos();
}

function setChannelFilterByIndex(idx) {
  if (idx === 0) channelFilter = '';
  else channelFilter = (channels[idx - 1] && channels[idx - 1].name) || '';
  renderFilterTabs();
  renderVideos();
}

function renderVideos() {
  const grid = document.getElementById('videoGrid');
  const empty = document.getElementById('emptyState');
  const filtered = videos.filter(videoMatchesFilter);

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(v => {
    const id = extractVideoId(v.url);
    const skip = formatSkip(parseInt(v.skip));
    const tagList = Array.isArray(v.tags) ? v.tags : [];
    const tagBadges = tagList.map(t => `<div class="cat-tag">${escHtml(t)}</div>`).join('');
    const chBadge = v.channel ? `<div class="channel-tag">${escHtml(v.channel)}</div>` : '';
    return `
    <div class="video-card" onclick='playVideo(${JSON.stringify(v).replace(/'/g, "&#39;")})'>
      <div class="thumb-wrap">
        <img src="${thumbUrl(id)}" alt="" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%2290%22><rect width=%22120%22 height=%2290%22 fill=%22%231a1b26%22/></svg>'">
        ${skip ? `<div class="skip-badge">▶ ${skip}〜</div>` : ''}
      </div>
      <div class="card-info">
        <div class="card-title">${escHtml(v.title || '（タイトルなし）')}</div>
        <div class="card-meta">
          <div class="badge-row">${chBadge}${tagBadges}</div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="icon-btn" onclick="openEditModal('${v.id}')" title="編集">✏️</button>
            <button class="icon-btn" onclick="openDelModal('${v.id}')" title="削除">🗑</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderChannelSelect() {
  const sel = document.getElementById('inputChannel');
  const labelOf = c => c.icon ? `${c.icon} ${c.name}` : c.name;
  const options = [['', '(指定なし)'], ...channels.map(c => [c.name, labelOf(c)])];
  sel.innerHTML = options.map(([v, l]) => `<option value="${escHtml(v)}">${escHtml(l)}</option>`).join('');
  sel.value = selectedChannel;
}

function renderTagPicker() {
  const wrap = document.getElementById('tagPicker');
  if (!tags.length) {
    wrap.innerHTML = '<div class="hint-muted" style="font-size:12px">タグがありません。🏷ボタンから追加できます</div>';
    return;
  }
  wrap.innerHTML = tags.map(t => {
    const on = selectedTags.includes(t);
    return `<button type="button" class="tag-chip ${on ? 'on' : ''}" data-tag="${escHtml(t)}" onclick="toggleTagPick(this)">${escHtml(t)}</button>`;
  }).join('');
}

function toggleTagPick(btn) {
  const t = btn.dataset.tag;
  const i = selectedTags.indexOf(t);
  if (i >= 0) selectedTags.splice(i, 1);
  else selectedTags.push(t);
  btn.classList.toggle('on');
}

function addChannelInline() {
  const name = (prompt('新しいチャンネル名') || '').trim();
  if (!name) return;
  if (!channels.some(c => c.name === name)) {
    channels.push({ name, icon: '' });
    save();
  }
  selectedChannel = name;
  renderChannelSelect();
  showToast(`チャンネル「${name}」を追加しました`);
}

let oembedToken = 0;
async function handleUrlChange() {
  const url = document.getElementById('inputUrl').value.trim();
  if (!url || !extractVideoId(url)) return;
  const hint = document.getElementById('urlFetchHint');
  const myToken = ++oembedToken;
  hint.textContent = '取得中…';
  try {
    const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);
    if (myToken !== oembedToken) return;
    if (!r.ok) { hint.textContent = ''; return; }
    const data = await r.json();
    if (myToken !== oembedToken) return;
    const titleEl = document.getElementById('inputTitle');
    if (!titleEl.value.trim() && data.title) titleEl.value = data.title;
    if (!selectedChannel && data.author_name) {
      const name = data.author_name;
      if (!channels.some(c => c.name === name)) {
        channels.push({ name, icon: '' });
        save();
      }
      selectedChannel = name;
      renderChannelSelect();
    }
    hint.textContent = '✓';
    setTimeout(() => { if (myToken === oembedToken) hint.textContent = ''; }, 1500);
  } catch {
    if (myToken === oembedToken) hint.textContent = '';
  }
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '動画を追加';
  document.getElementById('inputUrl').value = '';
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputSkip').value = '';
  document.getElementById('urlFetchHint').textContent = '';
  selectedTags = [];
  selectedChannel = '';
  renderChannelSelect();
  renderTagPicker();
  updateSkipPreview();
  openModal('addModal');
}

function openEditModal(id) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '動画を編集';
  document.getElementById('inputUrl').value = v.url || '';
  document.getElementById('inputTitle').value = v.title || '';
  document.getElementById('inputSkip').value = secondsToCompactInput(v.skip);
  document.getElementById('urlFetchHint').textContent = '';
  selectedTags = Array.isArray(v.tags) ? [...v.tags] : [];
  selectedChannel = v.channel || '';
  renderChannelSelect();
  renderTagPicker();
  updateSkipPreview();
  openModal('addModal');
}

function saveVideo() {
  const url = document.getElementById('inputUrl').value.trim();
  const title = document.getElementById('inputTitle').value.trim();
  const skip = parseSkipInput(document.getElementById('inputSkip').value);
  const channel = document.getElementById('inputChannel').value;
  const vidTags = selectedTags.filter(t => tags.includes(t));

  if (!url) { showToast('URLを入力してください'); return; }
  if (!extractVideoId(url)) { showToast('YouTubeのURLを入力してください'); return; }
  if (skip === null) { showToast('開始時刻の形式が不正です'); return; }

  if (editingId) {
    const idx = videos.findIndex(v => v.id === editingId);
    if (idx >= 0) videos[idx] = { ...videos[idx], url, title, skip, channel, tags: vidTags };
  } else {
    videos.unshift({ id: Date.now().toString(), url, title, skip, channel, tags: vidTags });
  }

  save();
  closeModal('addModal');
  renderFilterTabs();
  renderVideos();
  showToast(editingId ? '更新しました' : '追加しました 🌙');
}

function openDelModal(id) {
  deletingId = id;
  const v = videos.find(x => x.id === id);
  document.getElementById('delTargetTitle').textContent = v?.title || '（タイトルなし）';
  openModal('delModal');
}

function confirmDelete() {
  videos = videos.filter(v => v.id !== deletingId);
  save();
  closeModal('delModal');
  renderFilterTabs();
  renderVideos();
  showToast('削除しました');
}

function openManageModal() {
  setManageKind(manageKind);
  openModal('manageModal');
}

function setManageKind(kind) {
  manageKind = kind;
  document.querySelectorAll('#manageSeg .axis-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.kind === kind);
  });
  document.getElementById('manageInputLabel').textContent = kind === 'tag' ? '新しいタグ' : '新しいチャンネル';
  document.getElementById('manageInput').placeholder = kind === 'tag' ? '例: 囁き系、環境音...' : '例: チャンネル名';
  renderManageList();
}

function manageItems() { return manageKind === 'tag' ? tags : channels; }

function isItemInUse(name) {
  if (manageKind === 'tag') return videos.some(v => Array.isArray(v.tags) && v.tags.includes(name));
  return videos.some(v => v.channel === name);
}

function renderManageList() {
  const items = manageItems();
  const list = document.getElementById('manageList');
  if (!items.length) {
    list.innerHTML = '<div class="hint-muted" style="font-size:12px;padding:8px 0">まだ登録がありません</div>';
    return;
  }
  if (manageKind === 'channel') {
    list.innerHTML = items.map((c, i) => `
      <div class="cat-item with-icon">
        <input class="ch-icon" type="text" value="${escHtml(c.icon || '')}" placeholder="🎙" oninput="updateChannelIcon(${i}, this.value)">
        <span class="name-text">${escHtml(c.name)}</span>
        <div class="reorder-btns">
          <button onclick="moveManageItem(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="上へ">▲</button>
          <button onclick="moveManageItem(${i}, 1)" ${i === items.length - 1 ? 'disabled' : ''} title="下へ">▼</button>
          <button onclick="deleteManageItem(${i})" title="削除">×</button>
        </div>
      </div>`).join('');
  } else {
    list.innerHTML = items.map((name, i) => `
      <div class="cat-item">
        <span>${escHtml(name)}</span>
        <div class="reorder-btns">
          <button onclick="moveManageItem(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="上へ">▲</button>
          <button onclick="moveManageItem(${i}, 1)" ${i === items.length - 1 ? 'disabled' : ''} title="下へ">▼</button>
          <button onclick="deleteManageItem(${i})" title="削除">×</button>
        </div>
      </div>`).join('');
  }
}

function updateChannelIcon(i, value) {
  if (!channels[i]) return;
  channels[i].icon = value;
  save();
  renderFilterTabs();
}

function addManageItem() {
  const inp = document.getElementById('manageInput');
  const val = inp.value.trim();
  if (!val) return;
  if (manageKind === 'tag') {
    if (tags.includes(val)) { showToast('すでに存在します'); return; }
    tags.push(val);
  } else {
    if (channels.some(c => c.name === val)) { showToast('すでに存在します'); return; }
    channels.push({ name: val, icon: '' });
  }
  save();
  inp.value = '';
  renderManageList();
  renderFilterTabs();
  showToast(`「${val}」を追加しました`);
}

function deleteManageItem(i) {
  const items = manageItems();
  const entry = items[i];
  const name = manageKind === 'tag' ? entry : (entry && entry.name) || '';
  if (isItemInUse(name)) {
    showToast(manageKind === 'tag' ? 'この動画が使用中のタグは削除できません' : 'この動画が使用中のチャンネルは削除できません');
    return;
  }
  items.splice(i, 1);
  save();
  renderManageList();
  renderFilterTabs();
}

function moveManageItem(i, dir) {
  const items = manageItems();
  const j = i + dir;
  if (j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  save();
  renderManageList();
  renderFilterTabs();
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

// オーバーレイタップで閉じる
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) closeModal(el.id);
  });
});

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// インポート用ファイル選択
document.getElementById('importFile').addEventListener('change', ev => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    document.getElementById('importText').value = String(r.result || '');
    applyImport(String(r.result || ''), document.getElementById('importMode').value);
  };
  r.readAsText(file);
  ev.target.value = '';
});

// 初期表示 (ローカルキャッシュを即描画してからクラウドに接続)
renderFilterTabs();
renderVideos();
initCloud();
</script>
