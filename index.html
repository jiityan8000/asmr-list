<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="睡眠ASMR">
<meta name="theme-color" content="#141218" id="themeColorMeta">
<title>睡眠ASMR</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2313141c'/><circle cx='41' cy='32' r='20' fill='%23c084fc'/><circle cx='51' cy='32' r='20' fill='%2313141c'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2313141c'/><circle cx='41' cy='32' r='20' fill='%23c084fc'/><circle cx='51' cy='32' r='20' fill='%2313141c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     Material Design 3 デザイントークン
     - :root はライトテーマ
     - system 追従は @media、手動切替は [data-theme] で上書き
     ========================================================= */
  :root {
    --md-primary: #6750a4;
    --md-on-primary: #ffffff;
    --md-primary-container: #eaddff;
    --md-on-primary-container: #21005d;
    --md-secondary-container: #e8def8;
    --md-on-secondary-container: #1d192b;
    --md-tertiary-container: #ffd8e4;
    --md-on-tertiary-container: #31111d;
    --md-error: #b3261e;
    --md-on-error: #ffffff;
    --md-error-container: #f9dedc;
    --md-on-error-container: #410e0b;
    --md-surface: #fef7ff;
    --md-surface-container-lowest: #ffffff;
    --md-surface-container-low: #f7f2fa;
    --md-surface-container: #f3edf7;
    --md-surface-container-high: #ece6f0;
    --md-surface-container-highest: #e6e0e9;
    --md-on-surface: #1d1b20;
    --md-on-surface-variant: #49454f;
    --md-outline: #79747e;
    --md-outline-variant: #cac4d0;
    --md-inverse-surface: #322f35;
    --md-inverse-on-surface: #f5eff7;
    --md-scrim: rgba(0, 0, 0, 0.4);
    --md-shadow: rgba(0, 0, 0, 0.15);
    --md-success: #146c2e;

    /* state layer の不透明度 (MD3 仕様値) */
    --state-hover: 0.08;
    --state-press: 0.12;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --md-primary: #d0bcff;
      --md-on-primary: #381e72;
      --md-primary-container: #4f378b;
      --md-on-primary-container: #eaddff;
      --md-secondary-container: #4a4458;
      --md-on-secondary-container: #e8def8;
      --md-tertiary-container: #633b48;
      --md-on-tertiary-container: #ffd8e4;
      --md-error: #f2b8b5;
      --md-on-error: #601410;
      --md-error-container: #8c1d18;
      --md-on-error-container: #f9dedc;
      --md-surface: #141218;
      --md-surface-container-lowest: #0f0d13;
      --md-surface-container-low: #1d1b20;
      --md-surface-container: #211f26;
      --md-surface-container-high: #2b2930;
      --md-surface-container-highest: #36343b;
      --md-on-surface: #e6e0e9;
      --md-on-surface-variant: #cac4d0;
      --md-outline: #938f99;
      --md-outline-variant: #49454f;
      --md-inverse-surface: #e6e0e9;
      --md-inverse-on-surface: #322f35;
      --md-scrim: rgba(0, 0, 0, 0.6);
      --md-shadow: rgba(0, 0, 0, 0.5);
      --md-success: #7ddc96;

      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --md-primary: #d0bcff;
    --md-on-primary: #381e72;
    --md-primary-container: #4f378b;
    --md-on-primary-container: #eaddff;
    --md-secondary-container: #4a4458;
    --md-on-secondary-container: #e8def8;
    --md-tertiary-container: #633b48;
    --md-on-tertiary-container: #ffd8e4;
    --md-error: #f2b8b5;
    --md-on-error: #601410;
    --md-error-container: #8c1d18;
    --md-on-error-container: #f9dedc;
    --md-surface: #141218;
    --md-surface-container-lowest: #0f0d13;
    --md-surface-container-low: #1d1b20;
    --md-surface-container: #211f26;
    --md-surface-container-high: #2b2930;
    --md-surface-container-highest: #36343b;
    --md-on-surface: #e6e0e9;
    --md-on-surface-variant: #cac4d0;
    --md-outline: #938f99;
    --md-outline-variant: #49454f;
    --md-inverse-surface: #e6e0e9;
    --md-inverse-on-surface: #322f35;
    --md-scrim: rgba(0, 0, 0, 0.6);
    --md-shadow: rgba(0, 0, 0, 0.5);
    --md-success: #7ddc96;

    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--md-surface);
    color: var(--md-on-surface);
    font-family: 'Roboto', 'Noto Sans JP', system-ui, -apple-system, 'Hiragino Sans', sans-serif;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  svg { display: block; fill: currentColor; }

  /* ---------- タップ可能な要素の共通土台 (state layer) ---------- */
  .touchable {
    position: relative;
    border: none;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    overflow: hidden;
  }
  .touchable::after {
    content: '';
    position: absolute;
    inset: 0;
    background: currentColor;
    opacity: 0;
    transition: opacity 0.12s;
    pointer-events: none;
  }
  .touchable:active::after { opacity: var(--state-press); }
  @media (hover: hover) {
    .touchable:hover::after { opacity: var(--state-hover); }
  }
  .touchable:focus-visible {
    outline: 3px solid var(--md-primary);
    outline-offset: 2px;
  }

  /* ---------- アイコンボタン (48dp タップ領域) ---------- */
  .icon-btn {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--md-on-surface-variant);
    flex-shrink: 0;
  }
  .icon-btn svg { width: 24px; height: 24px; }

  /* ---------- トップアプリバー ---------- */
  .app-bar {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 64px;
    padding: 8px 4px 8px 16px;
    padding-top: calc(8px + env(safe-area-inset-top));
    background: var(--md-surface-container);
    color: var(--md-on-surface);
  }
  .app-bar__title {
    flex: 1;
    font-size: 22px;
    font-weight: 400;
    line-height: 28px;
    letter-spacing: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- チップ (MD3 filter chip / 48dp 高さ) ---------- */
  .chip-bar {
    position: sticky;
    top: calc(64px + env(safe-area-inset-top));
    z-index: 30;
    background: var(--md-surface);
    border-bottom: 1px solid var(--md-outline-variant);
  }
  .chip-scroller {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 8px 16px;
    scroll-padding: 16px;
  }
  .chip-scroller::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 48px;
    padding: 0 20px;
    border-radius: 12px;
    border: 1px solid var(--md-outline);
    background: transparent;
    color: var(--md-on-surface-variant);
    font-size: 15px;
    font-weight: 500;
    line-height: 20px;
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] {
    background: var(--md-secondary-container);
    color: var(--md-on-secondary-container);
    border-color: transparent;
  }
  .chip__check { width: 20px; height: 20px; display: none; }
  .chip[aria-pressed="true"] .chip__check { display: block; }
  .chip__emoji { font-size: 18px; line-height: 1; }
  .chip__count {
    font-size: 13px;
    font-weight: 400;
    opacity: 0.75;
  }

  /* ---------- 一覧 ---------- */
  main {
    padding: 8px 16px 200px;
  }

  .list-meta {
    padding: 8px 4px 12px;
    font-size: 14px;
    line-height: 20px;
    color: var(--md-on-surface-variant);
  }

  .video-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    display: flex;
    align-items: stretch;
    background: var(--md-surface-container-low);
    border-radius: 16px;
    overflow: hidden;
  }

  .card__main {
    flex: 1;
    display: flex;
    align-items: stretch;
    gap: 12px;
    min-width: 0;
    padding: 0;
    text-align: left;
  }

  .card__thumb {
    position: relative;
    width: 116px;
    flex-shrink: 0;
    background: var(--md-surface-container-highest);
  }
  .card__thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card__skip {
    position: absolute;
    left: 6px;
    bottom: 6px;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 3px 8px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
  }
  .card__skip svg { width: 14px; height: 14px; }

  .card__body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 4px 12px 0;
  }

  .card__title {
    font-size: 16px;
    line-height: 22px;
    font-weight: 500;
    color: var(--md-on-surface);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card__badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .badge {
    font-size: 12px;
    line-height: 16px;
    padding: 3px 10px;
    border-radius: 8px;
    background: var(--md-surface-container-high);
    color: var(--md-on-surface-variant);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge--channel {
    background: var(--md-primary-container);
    color: var(--md-on-primary-container);
  }

  .card__menu {
    align-self: center;
    margin-right: 4px;
  }

  /* ---------- 空状態 ---------- */
  .empty-state {
    text-align: center;
    padding: 72px 24px;
    color: var(--md-on-surface-variant);
  }
  .empty-state svg { width: 48px; height: 48px; margin: 0 auto 16px; opacity: 0.6; }
  .empty-state p { font-size: 15px; line-height: 24px; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    right: 16px;
    bottom: calc(88px + env(safe-area-inset-bottom));
    z-index: 35;
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: var(--md-primary-container);
    color: var(--md-on-primary-container);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px var(--md-shadow);
  }
  .fab svg { width: 28px; height: 28px; }

  /* ---------- 下部フィルタバー (チャンネル) ---------- */
  .bottom-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 30;
    background: var(--md-surface-container);
    border-top: 1px solid var(--md-outline-variant);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-bar__label {
    padding: 8px 16px 0;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.4px;
    color: var(--md-on-surface-variant);
  }

  /* ---------- ボトムシート ---------- */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--md-scrim);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .sheet {
    width: 100%;
    max-width: 640px;
    max-height: 92dvh;
    overflow-y: auto;
    background: var(--md-surface-container-low);
    border-radius: 28px 28px 0 0;
    padding: 0 24px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    overscroll-behavior: contain;
  }
  .scrim.open .sheet { transform: translateY(0); }

  .sheet__handle {
    width: 32px;
    height: 4px;
    border-radius: 2px;
    background: var(--md-outline-variant);
    margin: 16px auto 8px;
  }
  .sheet__title {
    font-size: 22px;
    line-height: 28px;
    font-weight: 500;
    padding: 8px 0 16px;
  }
  .sheet__text {
    font-size: 14px;
    line-height: 22px;
    color: var(--md-on-surface-variant);
    margin-bottom: 16px;
  }

  /* 中央ダイアログ (削除確認) */
  .scrim--dialog { align-items: center; padding: 24px; }
  .dialog {
    width: 100%;
    max-width: 400px;
    background: var(--md-surface-container-high);
    border-radius: 28px;
    padding: 24px;
    transform: scale(0.9);
    opacity: 0;
    transition: transform 0.2s, opacity 0.2s;
  }
  .scrim.open .dialog { transform: scale(1); opacity: 1; }
  .dialog__title { font-size: 22px; line-height: 28px; margin-bottom: 16px; }
  .dialog__text { font-size: 14px; line-height: 20px; color: var(--md-on-surface-variant); margin-bottom: 24px; }
  .dialog__actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

  /* ---------- ボタン ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 24px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 500;
    line-height: 20px;
  }
  .btn svg { width: 20px; height: 20px; }
  .btn--filled { background: var(--md-primary); color: var(--md-on-primary); }
  .btn--tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .btn--outlined { border: 1px solid var(--md-outline); color: var(--md-primary); }
  .btn--text { color: var(--md-primary); padding: 0 16px; }
  .btn--danger { background: var(--md-error); color: var(--md-on-error); }
  .btn--block { width: 100%; }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-row .btn { flex: 1; min-width: 140px; }

  /* シート下部のアクション */
  .sheet__actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 24px;
  }

  /* ---------- リスト行 (メニュー / 管理) ---------- */
  .list-row {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    min-height: 56px;
    padding: 8px 8px;
    border-radius: 12px;
    font-size: 16px;
    line-height: 24px;
    color: var(--md-on-surface);
    text-align: left;
  }
  .list-row svg { width: 24px; height: 24px; color: var(--md-on-surface-variant); flex-shrink: 0; }
  .list-row--danger, .list-row--danger svg { color: var(--md-error); }

  .manage-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 56px;
    padding: 4px 4px 4px 12px;
    border-radius: 12px;
    background: var(--md-surface-container);
    margin-bottom: 8px;
  }
  /* 名前が長い場合は操作ボタンが次の行に折り返し、名前を省略しない */
  .manage-row__name {
    flex: 1 1 140px;
    min-width: 0;
    font-size: 15px;
    line-height: 20px;
    overflow-wrap: anywhere;
  }
  .manage-row__actions {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  /* input[type="text"] のグローバル指定より詳細度を上げる */
  .manage-row input.manage-row__icon {
    flex: 0 0 48px;
    width: 48px;
    min-width: 48px;
    height: 48px;
    min-height: 48px;
    padding: 0;
    text-align: center;
    font-size: 20px;
    border-radius: 12px;
    border: 1px solid var(--md-outline-variant);
    background: var(--md-surface-container-lowest);
    color: var(--md-on-surface);
    font-family: inherit;
  }
  .manage-row input.manage-row__icon:focus { padding: 0; border-width: 2px; }

  /* ---------- 入力 (MD3 outlined 相当) ---------- */
  .field { margin-bottom: 20px; }
  .field__label {
    display: block;
    font-size: 13px;
    line-height: 18px;
    font-weight: 500;
    color: var(--md-on-surface-variant);
    margin-bottom: 8px;
  }
  .field__hint { font-weight: 400; opacity: 0.8; }
  .field__note {
    font-size: 13px;
    line-height: 18px;
    color: var(--md-on-surface-variant);
    margin-top: 8px;
    min-height: 18px;
  }
  .field__note--error { color: var(--md-error); }

  input[type="text"], input[type="url"], select, textarea {
    width: 100%;
    min-height: 56px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--md-outline);
    background: var(--md-surface-container-lowest);
    color: var(--md-on-surface);
    font-family: inherit;
    font-size: 16px; /* iOS のズーム防止 */
    line-height: 24px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--md-primary);
    border-width: 2px;
    padding: 15px;
  }
  input::placeholder, textarea::placeholder { color: var(--md-on-surface-variant); opacity: 0.7; }

  select {
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 20px center, right 14px center;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 40px;
  }

  textarea {
    min-height: 96px;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 13px;
    line-height: 20px;
    resize: vertical;
  }

  .field-inline { display: flex; gap: 8px; align-items: stretch; }
  .field-inline select { flex: 1; }
  .field-inline .icon-btn {
    border: 1px solid var(--md-outline);
    border-radius: 12px;
    color: var(--md-primary);
    align-self: stretch;
    height: auto;
  }

  .tag-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 180px;
    overflow-y: auto;
  }

  /* ---------- セグメントボタン ---------- */
  .segmented {
    display: flex;
    margin-bottom: 20px;
  }
  .segmented__btn {
    flex: 1;
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--md-outline);
    color: var(--md-on-surface);
    font-size: 15px;
    font-weight: 500;
  }
  .segmented__btn:first-child { border-radius: 24px 0 0 24px; }
  .segmented__btn:last-child { border-radius: 0 24px 24px 0; border-left: none; }
  .segmented__btn[aria-pressed="true"] {
    background: var(--md-secondary-container);
    color: var(--md-on-secondary-container);
  }
  .segmented__btn svg { width: 20px; height: 20px; }

  /* ---------- 同期ステータス ---------- */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 20px;
    background: var(--md-surface-container-high);
    color: var(--md-on-surface-variant);
    margin-bottom: 16px;
  }
  .status svg { width: 18px; height: 18px; }
  .status--ok { color: var(--md-success); }
  .status--err { background: var(--md-error-container); color: var(--md-on-error-container); }

  .divider {
    height: 1px;
    background: var(--md-outline-variant);
    margin: 24px 0;
  }
  .section-label {
    font-size: 13px;
    line-height: 18px;
    font-weight: 500;
    letter-spacing: 0.4px;
    color: var(--md-on-surface-variant);
    margin-bottom: 12px;
  }
  .note {
    font-size: 13px;
    line-height: 20px;
    color: var(--md-on-surface-variant);
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--md-tertiary-container);
    color: var(--md-on-tertiary-container);
    margin-top: 16px;
  }

  /* ---------- スナックバー ---------- */
  .snackbar {
    position: fixed;
    left: 16px;

function svgIcon(name, cls) {
  return `<svg viewBox="0 0 24 24"${cls ? ` class="${cls}"` : ''}>${ICONS[name]}</svg>`;
}

/* ---------- テーマ (system / light / dark) ---------- */
const THEME_ORDER = ['system', 'light', 'dark'];
const THEME_LABEL = { system: '端末の設定に従います', light: 'ライトモード', dark: 'ダークモード' };
let themeMode = localStorage.getItem(THEME_KEY) || 'system';

function effectiveTheme() {
  if (themeMode !== 'system') return themeMode;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme() {
  const root = document.documentElement;
  if (themeMode === 'system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', themeMode);

  const btn = document.getElementById('themeBtn');
  if (btn) {
    btn.innerHTML = svgIcon(themeMode === 'system' ? 'auto' : themeMode === 'light' ? 'light' : 'dark');
    btn.title = THEME_LABEL[themeMode];
  }
  const meta = document.getElementById('themeColorMeta');
  if (meta) meta.content = effectiveTheme() === 'dark' ? '#211f26' : '#f3edf7';
}

function cycleTheme() {
  themeMode = THEME_ORDER[(THEME_ORDER.indexOf(themeMode) + 1) % THEME_ORDER.length];
  localStorage.setItem(THEME_KEY, themeMode);
  applyTheme();
  showToast(THEME_LABEL[themeMode]);
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (themeMode === 'system') applyTheme();
});

function migrateV2ToV3() {
  if (localStorage.getItem(STORAGE_KEY) !== null) return;
  const v2v = JSON.parse(localStorage.getItem(STORAGE_KEY_V2) || 'null');
  const v2c = JSON.parse(localStorage.getItem(CAT_KEY_V2) || 'null');
  if (Array.isArray(v2v)) {
    const migrated = v2v.map(v => ({
      id: v.id,
      url: v.url,
      title: v.title,
      skip: v.skip,
      channel: v.channel || '',
      tags: Array.isArray(v.tags) ? v.tags : (v.cat ? [v.cat] : [])
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
  } else {
    localStorage.setItem(STORAGE_KEY, '[]');
  }
  if (Array.isArray(v2c) && v2c.length) {
    localStorage.setItem(TAGS_KEY, JSON.stringify(v2c));
  }
  if (localStorage.getItem(CHANNELS_KEY) === null) {
    localStorage.setItem(CHANNELS_KEY, '[]');
  }
}
migrateV2ToV3();

function setupAppleTouchIcon() {
  try {
    const size = 180, s = size / 64;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#13141c';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#c084fc';
    ctx.beginPath();
    ctx.arc(41 * s, 32 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#13141c';
    ctx.beginPath();
    ctx.arc(51 * s, 32 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
    const dataUrl = canvas.toDataURL('image/png');
    let link = document.querySelector('link[rel="apple-touch-icon"]');
    if (!link) {
      link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      document.head.appendChild(link);
    }
    link.href = dataUrl;
  } catch {}
}
setupAppleTouchIcon();

let videos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let tags = JSON.parse(localStorage.getItem(TAGS_KEY) || JSON.stringify(DEFAULT_TAGS));
let channels = JSON.parse(localStorage.getItem(CHANNELS_KEY) || '[]');
function normalizeChannels() {
  channels = channels.map(c => typeof c === 'string'
    ? { name: c, icon: '' }
    : { name: (c && c.name) || '', icon: (c && c.icon) || '' }
  );
}

  localStorage.setItem(META_KEY, JSON.stringify(meta));
}

  meta.updatedAt = new Date().toISOString();

}

function migrateRemoteToV2(remote) {
  if (remote && remote.version === 2) return remote;
  const r = remote || {};
  const vids = Array.isArray(r.videos) ? r.videos.map(v => ({
    id: v.id,
    url: v.url,
    title: v.title,
    skip: v.skip,
    channel: v.channel || '',
    tags: Array.isArray(v.tags) ? v.tags : (v.cat ? [v.cat] : [])
  })) : [];
  return {
    version: 2,
    videos: vids,
    tags: Array.isArray(r.categories) ? r.categories : (Array.isArray(r.tags) ? r.tags : []),
    channels: Array.isArray(r.channels) ? r.channels : [],
    updatedAt: r.updatedAt || ''
  };
}

let cloudDoc = null;        // Firestore の DocumentReference
let cloudReady = false;     // 認証と購読が完了したか
let applyingRemote = false; // リモート適用中の push 抑止フラグ
let lastSyncedAt = null;

function buildPayload() {
  return {
    version: 2,
    videos,
    tags,
    channels,
    updatedAt: meta.updatedAt || new Date().toISOString()
  };
}

function isEmptyData(vs, chs) {
  return !vs.length && !chs.length;
}

function schedulePush() {
  if (!cloudDoc || applyingRemote) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    pushToCloud().catch(e => setStatus('err', e.message));
  }, PUSH_DEBOUNCE_MS);
}

function applyRemote(remote) {
  const r = migrateRemoteToV2(remote);
  applyingRemote = true;
  videos = r.videos;
  if (r.tags.length) tags = r.tags;
  channels = r.channels;
  normalizeChannels();
  meta.updatedAt = r.updatedAt || new Date().toISOString();
  persistLocal();
  applyingRemote = false;
  renderFilterTabs();
  renderVideos();
}

async function pushToCloud() {
  if (!cloudDoc) return;
  setStatus('syncing');
  if (!meta.updatedAt) {
    meta.updatedAt = new Date().toISOString();
    persistLocal();
  }
  await cloudDoc.set(buildPayload());
  setStatus('ok');
}

// クラウドの内容を受け取ったときの反映判断 (updatedAt の新しい方を採用)
function onCloudSnapshot(snap) {
  if (snap.metadata.hasPendingWrites) return; // 自分の書き込みの反射は無視
  cloudReady = true;

  if (!snap.exists) { // 初回: この端末の内容でクラウドを初期化
    pushToCloud().catch(e => setStatus('err', e.message));
    return;
  }

  const r = migrateRemoteToV2(snap.data() || {});
  const remoteTs = r.updatedAt || '';
  const localTs = meta.updatedAt || '';
  const remoteEmpty = isEmptyData(r.videos, r.channels);
  const localEmpty = isEmptyData(videos, channels);

  // 空のクラウドデータで手元のリストを消さない
  if (remoteEmpty && !localEmpty) {
    pushToCloud().catch(e => setStatus('err', e.message));
  } else if (remoteTs > localTs) {
    applyRemote(r);
    setStatus('ok');
    showToast('クラウドから同期しました');
  } else if (localTs > remoteTs) {
    pushToCloud().catch(e => setStatus('err', e.message));
  } else {
    setStatus('ok');
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(src));
    document.head.appendChild(s);
  });
}

// <script> タグでの読み込みに失敗した場合の予備 (CDN 一時障害・別バージョン)
async function ensureFirebaseSdk() {
  const loaded = () => typeof firebase !== 'undefined' && !!firebase.initializeApp;
  if (loaded()) return true;
  try {
    for (const m of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) {
      await loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_FALLBACK}/${m}`);
    }
  } catch {
    return false;
  }
  return loaded();
}

async function initCloud() {
  if (!(await ensureFirebaseSdk())) {
    setStatus('err', 'SDK を読み込めません (オフライン?)');
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    setStatus('syncing', '接続中…');
    firebase.auth().signInAnonymously()
      .then(() => {
        cloudDoc = firebase.firestore().collection(CLOUD_COLLECTION).doc(CLOUD_DOC);
        cloudDoc.onSnapshot(onCloudSnapshot, err => setStatus('err', err.message));
      })
      .catch(e => setStatus('err', e.message));
  } catch (e) {
    setStatus('err', e.message);
  }
}

function setStatus(kind, msg) {
  if (kind === 'ok') lastSyncedAt = new Date();
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.classList.remove('status--ok', 'status--err');
  if (kind === 'syncing') {
    el.innerHTML = svgIcon('sync') + (msg || '同期中…');
  } else if (kind === 'ok') {
    el.classList.add('status--ok');
    const t = lastSyncedAt || new Date();
    const hh = String(t.getHours()).padStart(2, '0');
    const mm = String(t.getMinutes()).padStart(2, '0');
    el.innerHTML = svgIcon('cloudDone') + `同期済み ${hh}:${mm}`;
  } else if (kind === 'err') {
    el.classList.add('status--err');
    el.innerHTML = svgIcon('cloudOff') + escHtml(`エラー: ${msg || ''}`.slice(0, 80));
  } else {
    el.innerHTML = svgIcon('sync') + (cloudReady ? '待機中' : '接続中…');
  }
}

function openSyncModal() {
  document.getElementById('exportPreview').value = '';
  document.getElementById('importText').value = '';
  openModal('syncModal');
}

async function handleCloudPull() {
  if (!cloudDoc) { showToast('クラウドに接続できていません'); return; }
  try {
    setStatus('syncing');
    const snap = await cloudDoc.get();
    if (!snap.exists) { showToast('クラウドにまだデータがありません'); setStatus(null); return; }
    applyRemote(snap.data());
    setStatus('ok');
    showToast('クラウドから取得しました');
  } catch (e) {
    setStatus('err', e.message);
    showToast('取得失敗: ' + e.message);
  }
}

async function handleCloudPush() {
  if (!cloudDoc) { showToast('クラウドに接続できていません'); return; }
  try {
    meta.updatedAt = new Date().toISOString();
    persistLocal();
    await pushToCloud();
    showToast('クラウドに送信しました');
  } catch (e) {
    setStatus('err', e.message);
    showToast('送信失敗: ' + e.message);
  }
}

function exportJson() {
  const payload = { version: 2, videos, tags, channels, exportedAt: new Date().toISOString() };
  const text = JSON.stringify(payload, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  a.href = url;
  a.download = `asmr-list-${date}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
  document.getElementById('exportPreview').value = text;
  showToast('エクスポートしました');
}

function importJsonFromText() {
  const text = document.getElementById('importText').value.trim();
  if (!text) { showToast('JSON を貼り付けてください'); return; }
  applyImport(text, document.getElementById('importMode').value);
}

function applyImport(text, mode) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch { showToast('JSON の形式が不正です'); return; }
  if (!parsed || !Array.isArray(parsed.videos)) {
    showToast('videos が配列ではありません'); return;
  }
  const r = migrateRemoteToV2(parsed);
  if (mode === 'replace') {
    videos = r.videos;
    if (r.tags.length) tags = r.tags;
    channels = r.channels;
  } else {
    const map = new Map(videos.map(v => [v.id, v]));
    r.videos.forEach(v => { if (v && v.id) map.set(v.id, v); });
    videos = Array.from(map.values());
    tags = Array.from(new Set([...tags, ...r.tags]));
    const seen = new Set(channels.map(c => (typeof c === 'string' ? c : c.name)));
    r.channels.forEach(c => {
      const name = typeof c === 'string' ? c : c.name;
      if (name && !seen.has(name)) { channels.push(c); seen.add(name); }
    });
  }
  normalizeChannels();
  save();
  renderFilterTabs();
  renderVideos();
  closeModal('syncModal');
  showToast(mode === 'replace' ? '上書きインポートしました' : 'マージインポートしました');
}

function extractVideoId(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtu.be')) {
      return u.pathname.slice(1).split(/[/?#]/)[0];
    }
    const m = u.pathname.match(/^\/(?:live|shorts|embed|v)\/([\w-]+)/);
    if (m) return m[1];
    return u.searchParams.get('v') || '';
  } catch { return ''; }
}

function thumbUrl(videoId) {
  return `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
}

function formatSkip(sec) {
  if (!sec || sec <= 0) return null;
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `0:${String(s).padStart(2,'0')}`;
}

function parseSkipInput(s) {
  s = (s || '').trim();
  if (s === '') return 0;
  if (!/^\d+$/.test(s)) return null;
  const n = parseInt(s, 10);
  if (s.length <= 2) return n;
  const ss = n % 100, mm = Math.floor(n / 100);
  if (ss < 60) return mm * 60 + ss;
  return n;
}

function formatSkipReadable(sec) {
  if (!sec || sec <= 0) return '指定なし';
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m === 0) return `${s}秒`;
  if (s === 0) return `${m}分`;
  return `${m}分${s}秒`;
}

function secondsToCompactInput(sec) {
  if (!sec || sec <= 0) return '';
  if (sec < 60) return String(sec);
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}${String(s).padStart(2, '0')}`;
}

function updateSkipPreview() {
  const inp = document.getElementById('inputSkip');
  const out = document.getElementById('skipPreview');
  if (!inp || !out) return;
  const parsed = parseSkipInput(inp.value);
  if (parsed === null) {
    out.textContent = '形式が不正です';
    out.classList.add('field__note--error');
  } else {
    out.textContent = parsed === 0 ? '指定なし' : `= ${formatSkipReadable(parsed)}`;
    out.classList.remove('field__note--error');
  }
}

function findVideo(id) {
  return videos.find(v => v.id === id);
}

function playVideo(id) {
  const v = findVideo(id);
  if (!v) return;
  const vid = extractVideoId(v.url);
  if (!vid) { showToast('URLが無効です'); return; }
  const skip = parseInt(v.skip) || 0;
  const ytUrl = `https://www.youtube.com/watch?v=${vid}${skip > 0 ? `&t=${skip}` : ''}`;
  showToast(`${skip > 0 ? formatSkip(skip) + 'から' : ''}再生します`);
  setTimeout(() => { window.location.href = ytUrl; }, 400);
}

function videoMatchesFilter(v) {
  if (tagFilter && !(Array.isArray(v.tags) && v.tags.includes(tagFilter))) return false;
  if (channelFilter && v.channel !== channelFilter) return false;
  return true;
}

function renderFilterTabs() {
  renderTagFilterRow();
  renderChannelFilterRow();
}

function chipHtml({ label, count, emoji, active, onclick }) {
  return `<button class="touchable chip" aria-pressed="${active}" onclick="${onclick}">` +
    svgIcon('check', 'chip__check') +
    (emoji ? `<span class="chip__emoji">${escHtml(emoji)}</span>` : '') +
    `<span>${escHtml(label)}</span>` +
    `<span class="chip__count">${count}</span>` +
  `</button>`;
}

function renderTagFilterRow() {
  const tabs = document.getElementById('tagFilterTabs');
  const baseFilter = v => !channelFilter || v.channel === channelFilter;
  const entries = [{ name: '', label: 'すべて', count: videos.filter(baseFilter).length }];
  tags.forEach(name => {
    entries.push({
      name,
      label: name,
      count: videos.filter(v => baseFilter(v) && Array.isArray(v.tags) && v.tags.includes(name)).length
    });
  });
  tabs.innerHTML = entries.map((e, idx) => chipHtml({
    label: e.label,
    count: e.count,
    active: tagFilter === e.name,
    onclick: `setTagFilterByIndex(${idx})`
  })).join('');
}

function renderChannelFilterRow() {
  const bar = document.getElementById('filterBar');
  const tabs = document.getElementById('channelFilterTabs');
  if (!channels.length) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  const baseFilter = v => !tagFilter || (Array.isArray(v.tags) && v.tags.includes(tagFilter));
  const entries = [{ name: '', label: 'すべて', emoji: '', count: videos.filter(baseFilter).length }];
  channels.forEach(c => {
    entries.push({
      name: c.name,
      label: c.name,
      emoji: c.icon || '',
      count: videos.filter(v => baseFilter(v) && v.channel === c.name).length
    });
  });
  tabs.innerHTML = entries.map((e, idx) => chipHtml({
    label: e.label,
    count: e.count,
    emoji: e.emoji,
    active: channelFilter === e.name,
    onclick: `setChannelFilterByIndex(${idx})`
  })).join('');
}

function setTagFilterByIndex(idx) {
  tagFilter = idx === 0 ? '' : (tags[idx - 1] || '');
  renderFilterTabs();
  renderVideos();
}

function setChannelFilterByIndex(idx) {
  if (idx === 0) channelFilter = '';
  else channelFilter = (channels[idx - 1] && channels[idx - 1].name) || '';
  renderFilterTabs();
  renderVideos();
}

function renderVideos() {
  const grid = document.getElementById('videoGrid');
  const empty = document.getElementById('emptyState');
  const metaEl = document.getElementById('listMeta');
  const filtered = videos.filter(videoMatchesFilter);

  const filterLabels = [tagFilter, channelFilter].filter(Boolean);
  metaEl.textContent = videos.length === 0 ? ''
    : filterLabels.length
      ? `${filtered.length}件 / 全${videos.length}件（${filterLabels.join(' × ')}）`
      : `${videos.length}件`;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    empty.querySelector('p').innerHTML = videos.length === 0
      ? 'まだ動画が登録されていません<br>右下の＋ボタンから追加できます'
      : '条件に合う動画がありません<br>フィルタを変えてみてください';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(v => {
    const vid = extractVideoId(v.url);
    const skip = formatSkip(parseInt(v.skip));
    const tagList = Array.isArray(v.tags) ? v.tags : [];
    const badges = (v.channel ? `<span class="badge badge--channel">${escHtml(v.channel)}</span>` : '')
      + tagList.map(t => `<span class="badge">${escHtml(t)}</span>`).join('');
    return `
    <article class="card">
      <button class="touchable card__main" onclick="playVideo('${escHtml(v.id)}')" aria-label="${escHtml(v.title || 'タイトルなし')}を再生">
        <div class="card__thumb">
          <img src="${thumbUrl(vid)}" alt="" loading="lazy"
               onerror="this.style.visibility='hidden'">
          ${skip ? `<span class="card__skip">${svgIcon('play')}${skip}</span>` : ''}
        </div>
        <div class="card__body">
          <div class="card__title">${escHtml(v.title || '（タイトルなし）')}</div>
          <div class="card__badges">${badges}</div>
        </div>
      </button>
      <button class="touchable icon-btn card__menu" onclick="openCardMenu('${escHtml(v.id)}')" aria-label="この動画のメニュー">
        ${svgIcon('more')}
      </button>
    </article>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ---------- カードのメニュー ---------- */
function openCardMenu(id) {
  const v = findVideo(id);
  if (!v) return;
  menuTargetId = id;
  document.getElementById('cardMenuTitle').textContent = v.title || '（タイトルなし）';
  openModal('cardMenu');
}

function menuPlay() {
  const id = menuTargetId;
  closeModal('cardMenu');
  playVideo(id);
}

function menuEdit() {
  const id = menuTargetId;
  closeModal('cardMenu');
  openEditModal(id);
}

function menuDelete() {
  const id = menuTargetId;
  closeModal('cardMenu');
  openDelModal(id);
}

function renderChannelSelect() {
  const sel = document.getElementById('inputChannel');
  const labelOf = c => c.icon ? `${c.icon} ${c.name}` : c.name;
  const options = [['', '(指定なし)'], ...channels.map(c => [c.name, labelOf(c)])];
  sel.innerHTML = options.map(([v, l]) => `<option value="${escHtml(v)}">${escHtml(l)}</option>`).join('');
  sel.value = selectedChannel;
}

function renderTagPicker() {
  const wrap = document.getElementById('tagPicker');
  if (!tags.length) {
    wrap.innerHTML = '<div class="field__note">タグがありません。上部の🏷ボタンから追加できます</div>';
    return;
  }
  wrap.innerHTML = tags.map(t => {
    const on = selectedTags.includes(t);
    return `<button type="button" class="touchable chip" aria-pressed="${on}" data-tag="${escHtml(t)}" onclick="toggleTagPick(this)">` +
      svgIcon('check', 'chip__check') + `<span>${escHtml(t)}</span></button>`;
  }).join('');
}

function toggleTagPick(btn) {
  const t = btn.dataset.tag;
  const i = selectedTags.indexOf(t);
  if (i >= 0) selectedTags.splice(i, 1);
  else selectedTags.push(t);
  btn.setAttribute('aria-pressed', String(i < 0));
}

function addChannelInline() {
  const name = (prompt('新しいチャンネル名') || '').trim();
  if (!name) return;
  if (!channels.some(c => c.name === name)) {
    channels.push({ name, icon: '' });
    save();
    renderFilterTabs();
  }
  selectedChannel = name;
  renderChannelSelect();
  showToast(`チャンネル「${name}」を追加しました`);
}

let oembedToken = 0;
async function handleUrlChange() {
  const url = document.getElementById('inputUrl').value.trim();
  if (!url || !extractVideoId(url)) return;
  const hint = document.getElementById('urlFetchHint');
  const myToken = ++oembedToken;
  hint.textContent = '取得中…';
  try {
    const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);
    if (myToken !== oembedToken) return;
    if (!r.ok) { hint.textContent = ''; return; }
    const data = await r.json();
    if (myToken !== oembedToken) return;
    const titleEl = document.getElementById('inputTitle');
    if (!titleEl.value.trim() && data.title) titleEl.value = data.title;
    if (!selectedChannel && data.author_name) {
      const name = data.author_name;
      if (!channels.some(c => c.name === name)) {
        channels.push({ name, icon: '' });
        save();
        renderFilterTabs();
      }
      selectedChannel = name;
      renderChannelSelect();
    }
    hint.textContent = '取得しました';
    setTimeout(() => { if (myToken === oembedToken) hint.textContent = ''; }, 1500);
  } catch {
    if (myToken === oembedToken) hint.textContent = '';
  }
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '動画を追加';
  document.getElementById('inputUrl').value = '';
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputSkip').value = '';
  document.getElementById('urlFetchHint').textContent = '';
  selectedTags = [];
  selectedChannel = '';
  renderChannelSelect();
  renderTagPicker();
  updateSkipPreview();
  openModal('addModal');
}

function openEditModal(id) {
  const v = findVideo(id);
  if (!v) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '動画を編集';
  document.getElementById('inputUrl').value = v.url || '';
  document.getElementById('inputTitle').value = v.title || '';
  document.getElementById('inputSkip').value = secondsToCompactInput(v.skip);
  document.getElementById('urlFetchHint').textContent = '';
  selectedTags = Array.isArray(v.tags) ? [...v.tags] : [];
  selectedChannel = v.channel || '';
  renderChannelSelect();
  renderTagPicker();
  updateSkipPreview();
  openModal('addModal');
}

function saveVideo() {
  const url = document.getElementById('inputUrl').value.trim();
  const title = document.getElementById('inputTitle').value.trim();
  const skip = parseSkipInput(document.getElementById('inputSkip').value);
  const channel = document.getElementById('inputChannel').value;
  const vidTags = selectedTags.filter(t => tags.includes(t));

  if (!url) { showToast('URLを入力してください'); return; }
  if (!extractVideoId(url)) { showToast('YouTubeのURLを入力してください'); return; }
  if (skip === null) { showToast('開始時刻の形式が不正です'); return; }

  if (editingId) {
    const idx = videos.findIndex(v => v.id === editingId);
    if (idx >= 0) videos[idx] = { ...videos[idx], url, title, skip, channel, tags: vidTags };
  } else {
    videos.unshift({ id: Date.now().toString(), url, title, skip, channel, tags: vidTags });
  }

  save();
  closeModal('addModal');
  renderFilterTabs();
  renderVideos();
  showToast(editingId ? '更新しました' : '追加しました');
}

function openDelModal(id) {
  deletingId = id;
  const v = findVideo(id);
  document.getElementById('delTargetTitle').textContent = v?.title || '（タイトルなし）';
  openModal('delModal');
}

function confirmDelete() {
  videos = videos.filter(v => v.id !== deletingId);
  save();
  closeModal('delModal');
  renderFilterTabs();
  renderVideos();
  showToast('削除しました');
}

function openManageModal() {
  setManageKind(manageKind);
  openModal('manageModal');
}

function setManageKind(kind) {
  manageKind = kind;
  document.querySelectorAll('#manageSeg .segmented__btn').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.kind === kind));
  });
  document.getElementById('manageInputLabel').textContent = kind === 'tag' ? '新しいタグ' : '新しいチャンネル';
  document.getElementById('manageInput').placeholder = kind === 'tag' ? '例: 囁き系、環境音...' : '例: チャンネル名';
  renderManageList();
}

function manageItems() { return manageKind === 'tag' ? tags : channels; }

function isItemInUse(name) {
  if (manageKind === 'tag') return videos.some(v => Array.isArray(v.tags) && v.tags.includes(name));
  return videos.some(v => v.channel === name);
}

function renderManageList() {
  const items = manageItems();
  const list = document.getElementById('manageList');
  if (!items.length) {
    list.innerHTML = '<div class="field__note">まだ登録がありません</div>';
    return;
  }
  list.innerHTML = items.map((item, i) => {
    const isTag = manageKind === 'tag';
    const name = isTag ? item : item.name;
    const iconInput = isTag ? '' :
      `<input class="manage-row__icon" type="text" value="${escHtml(item.icon || '')}" placeholder="🎙"
              aria-label="${escHtml(name)}のアイコン" oninput="updateChannelIcon(${i}, this.value)">`;
    return `
      <div class="manage-row">
        ${iconInput}
        <span class="manage-row__name">${escHtml(name)}</span>
        <span class="manage-row__actions">
          <button class="touchable icon-btn" onclick="moveManageItem(${i}, -1)" ${i === 0 ? 'disabled style="opacity:.3"' : ''} aria-label="${escHtml(name)}を上へ">${svgIcon('up')}</button>
          <button class="touchable icon-btn" onclick="moveManageItem(${i}, 1)" ${i === items.length - 1 ? 'disabled style="opacity:.3"' : ''} aria-label="${escHtml(name)}を下へ">${svgIcon('down')}</button>
          <button class="touchable icon-btn" onclick="deleteManageItem(${i})" aria-label="${escHtml(name)}を削除">${svgIcon('close')}</button>
        </span>
      </div>`;
  }).join('');
}

function updateChannelIcon(i, value) {
  if (!channels[i]) return;
  channels[i].icon = value;
  save();
  renderFilterTabs();
}

function addManageItem() {
  const inp = document.getElementById('manageInput');
  const val = inp.value.trim();
  if (!val) return;
  if (manageKind === 'tag') {
    if (tags.includes(val)) { showToast('すでに存在します'); return; }
    tags.push(val);
  } else {
    if (channels.some(c => c.name === val)) { showToast('すでに存在します'); return; }
    channels.push({ name: val, icon: '' });
  }
  save();
  inp.value = '';
  renderManageList();
  renderFilterTabs();
  showToast(`「${val}」を追加しました`);
}

function deleteManageItem(i) {
  const items = manageItems();
  const entry = items[i];
  const name = manageKind === 'tag' ? entry : (entry && entry.name) || '';
  if (isItemInUse(name)) {
    showToast(manageKind === 'tag' ? '使用中のタグは削除できません' : '使用中のチャンネルは削除できません');
    return;
  }
  items.splice(i, 1);
  if (manageKind === 'tag' && tagFilter === name) tagFilter = '';
  if (manageKind === 'channel' && channelFilter === name) channelFilter = '';
  save();
  renderManageList();
  renderFilterTabs();
  renderVideos();
}

function moveManageItem(i, dir) {
  const items = manageItems();
  const j = i + dir;
  if (j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  save();
  renderManageList();
  renderFilterTabs();
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

// 背景タップで閉じる
document.querySelectorAll('.scrim').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) closeModal(el.id);
  });
});

// Esc キーで閉じる (デスクトップ)
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.scrim.open').forEach(el => closeModal(el.id));
});

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// インポート用ファイル選択
document.getElementById('importFile').addEventListener('change', ev => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    document.getElementById('importText').value = String(r.result || '');
    applyImport(String(r.result || ''), document.getElementById('importMode').value);
  };
  r.readAsText(file);
  ev.target.value = '';
});

// 初期表示 (ローカルキャッシュを即描画してからクラウドに接続)
applyTheme();
renderFilterTabs();
renderVideos();
initCloud();
</script>

</body>
</html>
